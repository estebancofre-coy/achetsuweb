name: Deploy ACHETSU to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public site only
        run: |
          mkdir -p _site
          cp index.html elecciones.html maintenance.html CNAME _site/
          cp -r assets _site/assets
      - name: Inject Apps Script URL securely
        env:
          APPS_SCRIPT_URL: ${{ secrets.ACHETSU_APPS_SCRIPT_URL }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const url = process.env.APPS_SCRIPT_URL;
          if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url || "")) {
            throw new Error("ACHETSU_APPS_SCRIPT_URL must contain a valid Apps Script /exec URL.");
          }
          fs.writeFileSync("_site/assets/apps-script-config.js",
            "window.ACHETSU_APPS_SCRIPT_URL = " + JSON.stringify(url) + ";\n");
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
